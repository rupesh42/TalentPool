spring.application.name=SkillApplication
logging.level.org.springframework.jdbc=INFO
#disable h2 console for production as it will make the console available for users once deployed.
spring.datasource.url=jdbc:h2:mem:talentPool;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.datasource.name=talentPool
spring.datasource.generate-unique-name=false
spring.jpa.hibernate.ddl-auto=update
server.port=8081
spring.main.web-application-type=servlet
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=true